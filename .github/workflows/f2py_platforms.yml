name: F2PY platform matrix

# Executors for the platform-gated f2py issues: big-endian s390x via
# QEMU (gh-11831: character returns), and Windows toolchains
# (gh-26352 ifx linking, gh-15934 MinGW callbacks). These jobs exist
# to produce traces where maintainers have no hardware; run on demand.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/f2py-platform-matrix
      - ci/f2py-platform-matrix-integration
  pull_request:
    paths:
      - '.github/workflows/f2py_platforms.yml'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  f2py_s390x_qemu:
    # gh-11831: run the character-return tests on a big-endian arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: s390x
      - name: Build and test in an s390x container
        run: |
          docker run --rm --platform linux/s390x \
            -v $PWD:/numpy -w /numpy \
            s390x/python:3.12-bookworm bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                gfortran pkg-config libopenblas-dev ninja-build
              pip install -r requirements/build_requirements.txt \
                          -r requirements/test_requirements.txt
              pip install . -Csetup-args=-Dallow-noblas=true
              cd /tmp
              bash /numpy/.github/workflows/s390x_probe.sh
            '

  f2py_windows_mingw:
    # gh-15934: callback example under MinGW-w64 with the meson backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-gcc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Lift the blanket win32 Fortran skip (this job IS the gh-25134 leg)
        shell: pwsh
        run: |
          (Get-Content numpy/f2py/tests/util.py) -replace 'if sys.platform == "win32":', 'if False:  # executor: win32 skip lifted' | Set-Content numpy/f2py/tests/util.py
      - name: Add MinGW to PATH and build
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          pip install -r requirements/build_requirements.txt -r requirements/test_requirements.txt
          pip install . -Csetup-args=-Dallow-noblas=true
      - name: Run callback tests (gh-15934 reproducer class)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          cd $env:TEMP
          python -m pytest --pyargs numpy.f2py.tests.test_callback -v --no-header

  f2py_windows_ifx:
    # gh-26352: link failures with Intel ifx on Windows
    runs-on: windows-latest
    continue-on-error: true  # ifx availability on runners varies
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Intel Fortran (oneAPI)
        uses: fortran-lang/setup-fortran@8821f57b53846d35d62632eb51c60ac6c4bff4ce # v1.6.1
        with:
          compiler: intel
          version: '2025.0'
      - name: Build and run a minimal f2py module with ifx
        shell: cmd
        run: |
          pip install -r requirements/build_requirements.txt meson ninja
          pip install . -Csetup-args=-Dallow-noblas=true
          cd %TEMP%
          echo subroutine hi() > hi.f90
          echo   print *, "ok" >> hi.f90
          echo end subroutine >> hi.f90
          python -m numpy.f2py -c hi.f90 -m hi_ifx --fcompiler= --backend meson
          python -c "import hi_ifx; hi_ifx.hi()"
