name: F2PY platform matrix

# Executors for the platform-gated f2py issues: big-endian s390x via
# QEMU (gh-11831: character returns), Windows toolchains
# (gh-26352 ifx linking, gh-15934 MinGW callbacks), and macOS co-run
# isolation (gh-12066). These jobs exist to produce traces where
# maintainers have no hardware; run on demand.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/f2py-platform-matrix
  pull_request:
    paths:
      - '.github/workflows/f2py_platforms.yml'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  f2py_s390x_qemu:
    # gh-11831: run the character-return tests on a big-endian arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: s390x
      - name: Build and test in an s390x container
        run: |
          docker run --rm --platform linux/s390x \
            -v $PWD:/numpy -w /numpy \
            s390x/python:3.12-bookworm bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                gfortran pkg-config libopenblas-dev ninja-build
              pip install -r requirements/build_requirements.txt \
                          -r requirements/test_requirements.txt
              pip install . -Csetup-args=-Dallow-noblas=true
              cd /tmp
              python -m pytest --pyargs numpy.f2py.tests.test_return_character \
                -v --no-header
              python -m pytest --pyargs numpy.f2py.tests.test_kind -v --no-header
            '

  f2py_windows_mingw:
    # gh-15934: callback example under MinGW-w64 with the meson backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-gcc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Lift the blanket win32 Fortran skip (this job IS the gh-25134 leg)
        shell: pwsh
        run: |
          (Get-Content numpy/f2py/tests/util.py) -replace 'if sys.platform == "win32":', 'if False:  # executor: win32 skip lifted' | Set-Content numpy/f2py/tests/util.py
      - name: Add MinGW to PATH and build
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          (Get-Command gfortran).Source
          gfortran --version
          pip install -r requirements/build_requirements.txt -r requirements/test_requirements.txt
          pip install . -Csetup-args=-Dallow-noblas=true
      - name: Register the MinGW runtime DLL directory
        shell: pwsh
        run: |
          # Python >= 3.8 does not consult PATH for dependent DLLs of
          # extension modules, so freshly built modules that link
          # libgfortran/libgcc_s/libwinpthread fail to import with
          # 'DLL load failed'. sitecustomize runs in every test
          # process and registers the directory the supported way. The
          # action extracts its own msys64 (not C:\msys64), so take the
          # location from its output.
          $mingw = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Set-Content -Path "$site\sitecustomize.py" -Value "import os; os.add_dll_directory(r'$mingw')"
          python -c "import sys; assert 'sitecustomize' in sys.modules, 'sitecustomize not imported'"
      - name: Run callback tests (gh-15934 reproducer class)
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          cd $env:TEMP
          python -m pytest --pyargs numpy.f2py.tests.test_callback -v --no-header

  f2py_windows_ifx:
    # gh-26352: link failures with Intel ifx on Windows
    # Soft-fail only toolchain install (availability varies). A successful
    # install with a failed build/link/import fails the job so regressions
    # are not masked.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Intel Fortran (oneAPI)
        id: setup_ifx
        continue-on-error: true
        uses: fortran-lang/setup-fortran@8821f57b53846d35d62632eb51c60ac6c4bff4ce # v1.6.1
        with:
          compiler: intel
          version: '2024.1'
      - name: Persist the MSVC environment (meson probes ifx's linker as 'link')
        id: msvc_env
        continue-on-error: true
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build and run a minimal f2py module with ifx
        # Skip smoke when the toolchain did not install; hard-fail otherwise.
        if: steps.setup_ifx.outcome == 'success' && steps.msvc_env.outcome == 'success'
        shell: cmd
        run: |
          rem setup-fortran exports CC=icx/CXX=icpx, but the Fortran-only
          rem oneAPI install ships no icx; clear them so meson activates
          rem MSVC for the C side while FC stays ifx.
          set "CC="
          set "CXX="
          rem The exported env does not put ifx on PATH for cmd steps;
          rem activate the oneAPI environment the documented way.
          rem --force: setup-fortran leaks SETVARS_COMPLETED=1 without
          rem the PATH it implies, so an unforced call skips itself.
          rem VS lives outside setvars' standard search on the runner.
          rem
          rem Known fragility (runner-image layout): three hardcoded
          rem paths below break if GHA/oneAPI move installs without
          rem updating this job. A broken path now fails the smoke step
          rem hard (install soft-fail only); treat as image-layout debt.
          rem   1) VS2022INSTALLDIR -> ...\Visual Studio\2022\Enterprise
          rem   2) setvars.bat      -> ...\Intel\oneAPI\setvars.bat
          rem   3) Intel runtime DLL dir -> ...\compiler\latest\bin
          set "VS2022INSTALLDIR=C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          if exist "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" --force
          where ifx || exit /b 1
          where link || exit /b 1
          pip install -r requirements/build_requirements.txt meson ninja || exit /b 1
          pip install . -Csetup-args=-Dallow-noblas=true || exit /b 1
          rem /d: %TEMP% is on C: while the workspace is on D:, and a
          rem drive-crossing cd without it silently stays put, leaving
          rem the numpy source tree to shadow the installed package.
          cd /d %TEMP%
          echo subroutine hi() > hi.f90
          echo   print *, "ok" >> hi.f90
          echo end subroutine >> hi.f90
          rem ifx on Windows mangles HI (uppercase, no underscore); the
          rem wrapper's F_FUNC needs the documented macros, delivered to
          rem the C compile line by the define-passthrough fix.
          python -m numpy.f2py -c hi.f90 -m hi_ifx -DUPPERCASE_FORTRAN -DNO_APPEND_FORTRAN || exit /b 1
          rem Same DLL rule as MinGW: register the Intel runtime dir.
          python -c "import os; os.add_dll_directory(r'C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin'); import hi_ifx; hi_ifx.hi()" || exit /b 1

  f2py_macos_corun:
    # gh-12066: tests failed on macOS only when co-run with the rest of
    # numpy/f2py/tests; this job runs the full f2py suite under that
    # co-run condition (Darwin skips removed where applicable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install gfortran and build
        run: |
          set -ex
          brew install gcc || true
          GF=$( (find /opt/homebrew/bin /usr/local/bin -maxdepth 1 -name 'gfortran-*' 2>/dev/null || true) | sort -V | tail -1)
          ln -sf "$GF" "$(dirname "$GF")/gfortran"
          gfortran --version
          pip install -r requirements/build_requirements.txt \
                      -r requirements/test_requirements.txt
          pip install . -Csetup-args=-Dallow-noblas=true
      - name: Co-run the full f2py test suite (gh-12066 co-run condition)
        run: |
          set -ex
          cd /tmp
          # Full suite, no -k / -m filter: the original failure was under
          # co-run with the rest of numpy/f2py/tests (not a named subset).
          # Darwin-skipped classes such as TestCReturnReal are unmarked and
          # would be deselected by -m slow.
          python -m pytest --pyargs numpy.f2py.tests -v --no-header -x
